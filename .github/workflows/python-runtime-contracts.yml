name: Python runtime contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: imvia-ui-layer-review-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: imvia-ui-layer-review-canvas/requirements-rmbg.lock
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build the production workbench
        run: npm run build
      - name: Run shared installer lock contracts
        run: node --test src/runtime-install-lock.test.mjs
      - name: Run managed runtime contracts on macOS
        if: runner.os == 'macOS'
        run: node --test src/python-runtime-install.test.mjs src/node-runtime-install.test.mjs src/plugin-runtime-repair.test.mjs
      - name: Run injected Win32 contracts on Windows
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Windows|Win32" src/python-runtime-install.test.mjs src/node-runtime-install.test.mjs
      - name: Install the real wheel-only hashed managed runtime
        env:
          PYTHON: python
        run: node scripts/install-codex-plugin.mjs
      - name: Verify the real installed lock and distributions
        env:
          PYTHON: python
        run: node scripts/verify-installed-runtime.mjs
